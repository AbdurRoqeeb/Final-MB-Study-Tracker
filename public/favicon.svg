<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Shield Background with Royal Indigo Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Inner Stroke Highlight -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="14.5" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" fill="none" />

  <!-- Medical Cross in Center -->
  <path d="M28 18 H36 V28 H46 V36 H36 V46 H28 V36 H18 V28 H28 Z" fill="#ffffff" />

  <!-- Graduation Cap Silhouette / Academic Emblem overlay -->
  <path d="M32 12 L46 17 L32 22 L18 17 Z" fill="#38bdf8" opacity="0.95" />
  <path d="M42 20.5 V26 C42 28.5 37.5 30.5 32 30.5 C26.5 30.5 22 28.5 22 26 V20.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <!-- Tassel -->
  <circle cx="46" cy="22" r="1.5" fill="#facc15" />
  <path d="M46 17 V22" stroke="#facc15" stroke-width="1.5" stroke-linecap="round" />
</svg>
